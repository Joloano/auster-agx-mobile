name: auster_agx_mobile
description: Cliente mobile academico para acompanhamento offline-first de demandas do AusterAgX.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^6.0.5
  crypto: ^3.0.7
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  geolocator: ^13.0.1
  go_router: ^14.2.7
  intl: ^0.20.3
  path: ^1.9.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: true
  image_path: assets/branding/auster-launcher-icon.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/branding/auster-launcher-icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/branding/auster-logo-bicolor.png
    - assets/branding/auster-launcher-icon.png
  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
